name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Runs in demo mode (no NEXT_PUBLIC_DATA_MODE / Supabase env vars),
      # same as any fresh checkout without a .env.local. The real-Postgres
      # integration tests use an embedded PGlite instance, not a live
      # Supabase project, so no secrets are needed here.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  deploy:
    name: Deploy to Vercel (production)
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.VERCEL_TOKEN != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls this project's real production env vars from Vercel itself
      # (LEGAL_TAX_ID, RESEND_API_KEY, etc.) so the build below matches what
      # Vercel would have built on its own -- nothing is read from this
      # repo's own .env files, which never hold real secrets.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
