name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Runs in demo mode (no NEXT_PUBLIC_DATA_MODE / Supabase env vars),
      # same as any fresh checkout without a .env.local. The real-Postgres
      # integration tests use an embedded PGlite instance, not a live
      # Supabase project, so no secrets are needed here.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
